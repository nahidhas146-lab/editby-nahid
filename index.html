<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditbyNahid | Professional Video Editing Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#08080D',
                        cardBg: '#11111A',
                        primaryPurple: '#6C4BF4',
                        accentBlue: '#00C2FF',
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glow: {
                            '0%': { opacity: 0.4 },
                            '100%': { opacity: 0.8 },
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #08080D;
            color: #FFFFFF;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(17, 17, 26, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(108, 75, 244, 0.15);
        }
        .glass-card {
            background: rgba(17, 17, 26, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(108, 75, 244, 0.4);
            box-shadow: 0 0 25px rgba(108, 75, 244, 0.2);
            transform: translateY(-4px);
        }
        .gradient-text {
            background: linear-gradient(135deg, #FFFFFF 0%, #00C2FF 50%, #6C4BF4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gradient-bg {
            background: linear-gradient(135deg, #6C4BF4 0%, #00C2FF 100%);
        }
        .glow-purple {
            box-shadow: 0 0 30px rgba(108, 75, 244, 0.3);
        }
        .glow-blue {
            box-shadow: 0 0 30px rgba(0, 194, 255, 0.3);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #08080D;
        }
        ::-webkit-scrollbar-thumb {
            background: #11111A;
            border-radius: 4px;
            border: 1px solid rgba(108, 75, 244, 0.2);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6C4BF4;
        }
    </style>
</head>
<body class="bg-darkBg text-white antialiased min-h-screen flex flex-col justify-between">

    <!-- Background Ambient Glows -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-primaryPurple/15 rounded-full blur-3xl pointer-events-none -z-10 animate-pulse-slow"></div>
    <div class="fixed bottom-10 right-1/4 w-96 h-96 bg-accentBlue/10 rounded-full blur-3xl pointer-events-none -z-10 animate-pulse-slow"></div>

    <div id="app" class="flex flex-col min-h-screen justify-between w-full">
        <!-- Application container managed dynamically -->
    </div>

    <!-- Notification Toast Modal Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Video Modal Player -->
    <div id="video-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-panel rounded-2xl max-w-4xl w-full p-4 relative border border-primaryPurple/30">
            <button onclick="closeVideoModal()" class="absolute -top-4 -right-4 bg-primaryPurple text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg hover:scale-110 transition z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modal-video-container" class="relative aspect-video w-full bg-black rounded-xl overflow-hidden flex items-center justify-center">
                <!-- Video player or iframe injected here -->
            </div>
            <div class="mt-4">
                <h3 id="modal-video-title" class="text-xl font-bold text-white"></h3>
                <p id="modal-video-desc" class="text-gray-400 text-sm mt-1"></p>
            </div>
        </div>
    </div>

    <!-- Quote Request Modal -->
    <div id="quote-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass-panel rounded-2xl max-w-lg w-full p-6 relative border border-primaryPurple/30">
            <button onclick="closeQuoteModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-2xl font-bold gradient-text mb-2">Request a Custom Quote</h3>
            <p class="text-gray-400 text-sm mb-6">Tell us about your project specifications and we'll get back to you within 24 hours.</p>
            <form id="quote-form" onsubmit="handleQuoteSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Project Type</label>
                    <select id="quote-type" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primaryPurple">
                        <option value="YouTube Long Form" class="bg-cardBg">YouTube Long Form</option>
                        <option value="Shorts / Reels / TikTok" class="bg-cardBg">Shorts / Reels / TikTok</option>
                        <option value="Gaming Montage" class="bg-cardBg">Gaming Montage</option>
                        <option value="Commercial / Promo" class="bg-cardBg">Commercial / Promo</option>
                        <option value="Custom Bundle" class="bg-cardBg">Custom Bundle</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Estimated Budget ($)</label>
                    <input type="text" id="quote-budget" placeholder="e.g. $250 - $500" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primaryPurple">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Project Details</label>
                    <textarea id="quote-details" rows="4" placeholder="Describe deliverables, deadline, and expectations..." required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primaryPurple"></textarea>
                </div>
                <button type="submit" class="w-full py-3 gradient-bg font-semibold rounded-xl shadow-lg hover:opacity-95 transition">Submit Quote Request</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs & Main Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            GoogleAuthProvider, 
            signInWithPopup,
            sendPasswordResetEmail,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            getDoc, 
            getDocs, 
            addDoc, 
            updateDoc, 
            onSnapshot,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase handles
        let app, db, auth;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'editbynahid-default-app';
        
        try {
            const firebaseConfig = JSON.parse(__firebase_config);
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch(e) {
            console.warn("Firebase config fallback initializing simulation mode", e);
        }

        // Application State
        let currentUser = null;
        let currentView = 'home'; // 'auth', 'home', 'services', 'portfolio', 'pricing', 'order', 'contact', 'dashboard'
        let userProjects = [];
        let userRequests = [];
        let selectedPortfolioCategory = 'ALL';

        // Sample Portfolio Data
        const portfolioItems = [
            { id: 1, title: "Cyberpunk Gaming Montage", category: "GAMING", desc: "High-octane Valorant edits with custom sound design and beat sync.", type: "youtube", src: "https://www.youtube.com/embed/dQw4w9WgXcQ", thumb: "https://placehold.co/600x340/11111A/6C4BF4?text=Gaming+Montage" },
            { id: 2, title: "Viral TikTok Transition Guide", category: "TIKTOK", desc: "Fast-paced educational reel with dynamic captions and pop sound effects.", type: "tiktok", src: "https://www.youtube.com/embed/dQw4w9WgXcQ", thumb: "https://placehold.co/600x340/11111A/00C2FF?text=TikTok+Reel" },
            { id: 3, title: "Tech Startup YouTube Docu-Style", category: "YOUTUBE", desc: "Cinematic 12-minute documentary exploring AI future with advanced color grading.", type: "youtube", src: "https://www.youtube.com/embed/dQw4w9WgXcQ", thumb: "https://placehold.co/600x340/11111A/6C4BF4?text=YouTube+Docu" },
            { id: 4, title: "Lifestyle Instagram Reel Aesthetic", category: "REELS", desc: "Smooth minimal transitions, lofi aesthetics, and color grading for fashion brand.", type: "reels", src: "https://www.youtube.com/embed/dQw4w9WgXcQ", thumb: "https://placehold.co/600x340/11111A/00C2FF?text=Reels+Edit" },
            { id: 5, title: "Apex Legends Epic Clutch", category: "GAMING", desc: "Clean kills compilation synced directly to hard bass drop audio tracks.", type: "youtube", src: "https://www.youtube.com/embed/dQw4w9WgXcQ", thumb: "https://placehold.co/600x340/11111A/6C4BF4?text=Apex+Clutch" },
            { id: 6, title: "Crypto Podcast Highlights", category: "TIKTOK", desc: "Engaging hook with dynamic text tracking and multi-cam layout.", type: "tiktok", src: "https://www.youtube.com/embed/dQw4w9WgXcQ", thumb: "https://placehold.co/600x340/11111A/00C2FF?text=Podcast+Clip" }
        ];

        window.onload = async () => {
            if (auth) {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    try {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } catch (err) {
                        console.error("Custom token sign in failed", err);
                    }
                }
                onAuthStateChanged(auth, async (user) => {
                    currentUser = user;
                    if (user) {
                        await loadUserData();
                        if (currentView === 'auth') currentView = 'home';
                    } else {
                        // If not logged in and trying to access protected views, force auth
                        if (['order', 'dashboard'].includes(currentView)) {
                            currentView = 'auth';
                        }
                    }
                    renderApp();
                });
            } else {
                // Mock user for local testing if firebase config is missing
                renderApp();
            }
        };

        async function loadUserData() {
            if (!currentUser || !db) return;
            try {
                const uid = currentUser.uid;
                
                // Fetch Projects
                const projRef = collection(db, 'artifacts', appId, 'users', uid, 'projects');
                const projSnap = await getDocs(query(projRef));
                userProjects = [];
                projSnap.forEach(docSnap => {
                    userProjects.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                // If empty, seed initial sample project
                if (userProjects.length === 0) {
                    const sampleProj = { title: "YouTube Cinematic Vlog #1", status: "In Progress", deadline: "2026-04-12", createdAt: new Date().toISOString() };
                    const newRef = await addDoc(projRef, sampleProj);
                    userProjects.push({ id: newRef.id, ...sampleProj });
                }

                // Fetch Requests
                const reqRef = collection(db, 'artifacts', appId, 'users', uid, 'requests');
                const reqSnap = await getDocs(query(reqRef));
                userRequests = [];
                reqSnap.forEach(docSnap => {
                    userRequests.push({ id: docSnap.id, ...docSnap.data() });
                });

            } catch (err) {
                console.error("Error loading user data from Firestore:", err);
            }
        }

        // Toast Notification System
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `glass-panel pointer-events-auto px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border transition-all duration-300 translate-y-5 opacity-0 ${type === 'success' ? 'border-green-500/40 text-green-400' : 'border-red-500/40 text-red-400'}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'} text-lg"></i><span class="text-white text-sm font-medium">${message}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-5', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-5', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Navigation Controller
        window.navigateTo = function(view) {
            if (['order', 'dashboard'].includes(view) && !currentUser) {
                showToast("Please log in to access this page.", "error");
                currentView = 'auth';
                renderApp();
                return;
            }
            currentView = view;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderApp();
        }

        window.renderApp = function() {
            const appEl = document.getElementById('app');
            
            let contentHTML = '';
            if (currentView === 'auth') {
                contentHTML = renderAuthView();
            } else {
                contentHTML = `
                    ${renderNavbar()}
                    <main class="flex-grow">
                        ${currentView === 'home' ? renderHomeView() : ''}
                        ${currentView === 'services' ? renderServicesView() : ''}
                        ${currentView === 'portfolio' ? renderPortfolioView() : ''}
                        ${currentView === 'pricing' ? renderPricingView() : ''}
                        ${currentView === 'order' ? renderOrderView() : ''}
                        ${currentView === 'contact' ? renderContactView() : ''}
                        ${currentView === 'dashboard' ? renderDashboardView() : ''}
                    </main>
                    ${renderFooter()}
                `;
            }
            appEl.innerHTML = contentHTML;
            attachEventHandlers();
        }

        function renderNavbar() {
            const isLoggedIn = currentUser !== null;
            return `
            <header class="sticky top-0 z-40 glass-panel border-b border-white/10 px-4 lg:px-12 py-4 transition-all">
                <div class="max-w-7xl mx-auto flex items-center justify-between">
                    <!-- Logo -->
                    <div onclick="navigateTo('home')" class="cursor-pointer flex items-center gap-2 group">
                        <div class="w-10 h-10 rounded-xl gradient-bg flex items-center justify-center shadow-lg group-hover:scale-105 transition glow-purple">
                            <i class="fa-solid fa-clapperboard text-white text-lg"></i>
                        </div>
                        <span class="text-xl font-extrabold tracking-tight gradient-text">EDITBYNAHID</span>
                    </div>

                    <!-- Desktop Navigation Links -->
                    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-300">
                        <button onclick="navigateTo('home')" class="hover:text-accentBlue transition ${currentView === 'home' ? 'text-accentBlue font-bold' : ''}">Home</button>
                        <button onclick="navigateTo('services')" class="hover:text-accentBlue transition ${currentView === 'services' ? 'text-accentBlue font-bold' : ''}">Services</button>
                        <button onclick="navigateTo('portfolio')" class="hover:text-accentBlue transition ${currentView === 'portfolio' ? 'text-accentBlue font-bold' : ''}">Portfolio</button>
                        <button onclick="navigateTo('pricing')" class="hover:text-accentBlue transition ${currentView === 'pricing' ? 'text-accentBlue font-bold' : ''}">Pricing</button>
                        <button onclick="navigateTo('contact')" class="hover:text-accentBlue transition ${currentView === 'contact' ? 'text-accentBlue font-bold' : ''}">Contact</button>
                        ${isLoggedIn ? `<button onclick="navigateTo('dashboard')" class="hover:text-accentBlue transition ${currentView === 'dashboard' ? 'text-accentBlue font-bold' : ''}">My Account</button>` : ''}
                    </nav>

                    <!-- Right User Action / Auth -->
                    <div class="hidden md:flex items-center gap-4">
                        ${isLoggedIn ? `
                            <div class="flex items-center gap-3 glass-panel px-4 py-2 rounded-xl border border-white/10">
                                <div class="w-8 h-8 rounded-full gradient-bg flex items-center justify-center font-bold text-sm">
                                    ${(currentUser.displayName || currentUser.email || 'U').charAt(0).toUpperCase()}
                                </div>
                                <span class="text-xs font-semibold text-gray-200 truncate max-w-[120px]">${currentUser.displayName || currentUser.email}</span>
                            </div>
                            <button onclick="handleLogout()" class="px-4 py-2 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-sm font-semibold hover:bg-red-500/20 transition flex items-center gap-2">
                                <i class="fa-solid fa-right-from-bracket"></i> Logout
                            </button>
                        ` : `
                            <button onclick="navigateTo('auth')" class="px-5 py-2.5 gradient-bg rounded-xl font-semibold text-sm shadow-lg hover:opacity-95 transition glow-purple">
                                Sign In / Register
                            </button>
                        `}
                        <button onclick="navigateTo('order')" class="px-5 py-2.5 bg-accentBlue/20 border border-accentBlue/50 text-accentBlue rounded-xl font-semibold text-sm hover:bg-accentBlue/30 transition glow-blue">
                            Order Edit
                        </button>
                    </div>

                    <!-- Mobile Menu Toggle -->
                    <button id="mobile-menu-btn" class="md:hidden text-gray-300 hover:text-white text-2xl focus:outline-none">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>

                <!-- Mobile Dropdown -->
                <div id="mobile-menu" class="hidden md:hidden pt-4 pb-2 border-t border-white/10 mt-4 flex flex-col gap-3">
                    <button onclick="navigateTo('home'); toggleMobileMenu();" class="text-left py-2 px-3 rounded-lg hover:bg-white/5">Home</button>
                    <button onclick="navigateTo('services'); toggleMobileMenu();" class="text-left py-2 px-3 rounded-lg hover:bg-white/5">Services</button>
                    <button onclick="navigateTo('portfolio'); toggleMobileMenu();" class="text-left py-2 px-3 rounded-lg hover:bg-white/5">Portfolio</button>
                    <button onclick="navigateTo('pricing'); toggleMobileMenu();" class="text-left py-2 px-3 rounded-lg hover:bg-white/5">Pricing</button>
                    <button onclick="navigateTo('contact'); toggleMobileMenu();" class="text-left py-2 px-3 rounded-lg hover:bg-white/5">Contact</button>
                    ${isLoggedIn ? `
                        <button onclick="navigateTo('dashboard'); toggleMobileMenu();" class="text-left py-2 px-3 rounded-lg hover:bg-white/5 text-accentBlue font-bold">My Account</button>
                        <button onclick="handleLogout(); toggleMobileMenu();" class="text-left py-2 px-3 rounded-lg hover:bg-red-500/10 text-red-400">Logout</button>
                    ` : `
                        <button onclick="navigateTo('auth'); toggleMobileMenu();" class="w-full py-2.5 gradient-bg rounded-xl text-center font-semibold">Sign In / Register</button>
                    `}
                    <button onclick="navigateTo('order'); toggleMobileMenu();" class="w-full py-2.5 bg-accentBlue/20 text-accentBlue border border-accentBlue/40 rounded-xl text-center font-semibold">Order Edit</button>
                </div>
            </header>
            `;
        }

        let authMode = 'login'; // 'login' or 'signup' or 'forgot'
        function renderAuthView() {
            return `
            <div class="min-h-screen flex items-center justify-center px-4 py-12 relative">
                <div class="absolute inset-0 bg-gradient-to-br from-primaryPurple/10 via-transparent to-accentBlue/15 -z-10"></div>
                <div class="glass-panel p-8 md:p-10 rounded-3xl max-w-md w-full border border-primaryPurple/30 shadow-2xl relative">
                    <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-20 h-20 rounded-2xl gradient-bg flex items-center justify-center shadow-xl glow-purple">
                        <i class="fa-solid fa-clapperboard text-3xl text-white"></i>
                    </div>
                    
                    <div class="text-center mt-6 mb-8">
                        <h2 class="text-3xl font-extrabold gradient-text">EditbyNahid Studio</h2>
                        <p class="text-gray-400 text-sm mt-1">Professional video editing portal</p>
                    </div>

                    <!-- Auth Tabs -->
                    <div class="flex rounded-xl bg-black/40 p-1 mb-6 border border-white/10">
                        <button onclick="setAuthMode('login')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition ${authMode === 'login' ? 'gradient-bg text-white shadow' : 'text-gray-400 hover:text-white'}">Login</button>
                        <button onclick="setAuthMode('signup')" class="flex-1 py-2 text-sm font-semibold rounded-lg transition ${authMode === 'signup' ? 'gradient-bg text-white shadow' : 'text-gray-400 hover:text-white'}">Sign Up</button>
                    </div>

                    ${authMode === 'login' ? `
                        <form onsubmit="handleLoginSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Email or Username</label>
                                <input type="text" id="login-identifier" placeholder="name@example.com" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primaryPurple">
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Password</label>
                                <input type="password" id="login-password" placeholder="••••••••" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-primaryPurple">
                            </div>
                            <div class="flex items-center justify-between text-xs">
                                <label class="flex items-center gap-2 text-gray-400 cursor-pointer"><input type="checkbox" class="rounded bg-black/50 border-white/10"> Remember me</label>
                                <button type="button" onclick="setAuthMode('forgot')" class="text-accentBlue hover:underline">Forgot password?</button>
                            </div>
                            <button type="submit" class="w-full py-3.5 gradient-bg rounded-xl font-bold shadow-lg hover:opacity-95 transition glow-purple">Login to Account</button>
                        </form>
                    ` : authMode === 'signup' ? `
                        <form onsubmit="handleSignupSubmit(event)" class="space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">First Name</label>
                                    <input type="text" id="signup-firstname" placeholder="Nahid" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-primaryPurple text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Last Name</label>
                                    <input type="text" id="signup-lastname" placeholder="Hasan" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-primaryPurple text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Email</label>
                                <input type="email" id="signup-email" placeholder="name@example.com" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-primaryPurple text-sm">
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1">Username</label>
                                <input type="text" id="signup-username" placeholder="nahid_editor" required class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-primaryPurple text-sm">
                            </div>

        window.handleLoginSubmit = async function(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value;
            const password = document.getElementById('login-password').value;

            try {
                if (auth) {
                    const email = identifier.includes('@') ? identifier : `${identifier}@editbynahid.mock`;
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    currentUser = { uid: 'mock-user-123', email: identifier, displayName: identifier.split('@')[0] };
                }
                showToast("Successfully logged in!");
                navigateTo('dashboard');
            } catch (err) {
                console.error("Login error:", err);
                showToast(err.message || "Invalid login credentials", "error");
            }
        }

        window.handleSignupSubmit = async function(e) {
            e.preventDefault();
            const firstname = document.getElementById('signup-firstname').value;
            const lastname = document.getElementById('signup-lastname').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;

            if (password !== confirm) {
                showToast("Passwords do not match.", "error");
                return;
            }

            try {
                if (auth) {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await updateProfile(cred.user, { displayName: `${firstname} ${lastname}` });
                    currentUser = cred.user;
                } else {
                    currentUser = { uid: 'mock-user-123', email, displayName: `${firstname} ${lastname}` };
                }
                showToast("Account created successfully!");
                navigateTo('dashboard');
            } catch (err) {
                console.error("Signup error:", err);
                showToast(err.message || "Registration failed", "error");
            }
        }

        window.handleForgotSubmit = async function(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value;
            try {
                if (auth) {
                    await sendPasswordResetEmail(auth, email);
                }
                showToast("Password reset link sent to your email.");
                setAuthMode('login');
            } catch (err) {
                showToast(err.message || "Failed to send reset email", "error");
            }
        }

        window.handleGoogleLogin = async function() {
            try {
                if (auth) {
                    const provider = new GoogleAuthProvider();
                    const result = await signInWithPopup(auth, provider);
                    currentUser = result.user;
                } else {
                    currentUser = { uid: 'google-mock-123', email: 'nahid.google@gmail.com', displayName: 'Nahid Google' };
                }
                showToast("Successfully signed in with Google!");
                navigateTo('dashboard');
            } catch (err) {
                console.error("Google Auth error:", err);
                showToast("Google authentication failed", "error");
            }
        }

        window.handleLogout = async function() {
            try {
                if (auth) {
                    await signOut(auth);
                }
                currentUser = null;
                showToast("Logged out successfully.");
                navigateTo('home');
            } catch (err) {
                console.error("Logout error:", err);
            }
        }

        // Mobile Menu Toggle Helper
        window.toggleMobileMenu = function() {
            const menu = document.getElementById('mobile-menu');
            if (menu) menu.classList.toggle('hidden');
        }

        function attachEventHandlers() {
            const btn = document.getElementById('mobile-menu-btn');
            if (btn) {
                btn.onclick = toggleMobileMenu;
            }
        }
